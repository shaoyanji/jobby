version: '3'

# resumectl pipeline: resume.json -> loadout + i18n view -> typst -> pdfcpu -> mupdf.
#
# Every task is a thin call into ./bin/resumectl so the Go code is the only
# place that knows the pipeline; Taskfile is the discoverable entrypoint.
# Dependencies come from the flake: run `nix develop` (or `task shell`).

vars:
  ROOT: '.'
  CTL: './bin/resumectl'
  WB: './bin/workbench'
  LANG: '{{default "en" .LANG}}'
  PROFILE: '{{default "default" .PROFILE}}'
  OUT_PDF: 'dist/resume-{{.LANG}}.pdf'
  MAPPE_PDF: 'dist/bewerbungsmappe-de.pdf'

tasks:
  default:
    desc: List the pipeline tasks
    cmds:
      - task --list

  shell:
    desc: Enter the flake dev shell (go, typst, pdfcpu, mupdf, trans, vd)
    cmds:
      - nix develop

  bin:
    desc: Build ./bin/resumectl when sources changed
    sources:
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - go.mod
      - go.sum
    generates:
      - 'bin/resumectl'
    cmds:
      - mkdir -p bin
      - go build -o bin/resumectl ./cmd/resumectl

  tui:
    desc: Interactive menu (review, loadout, sync, build)
    deps: [bin]
    interactive: true
    cmds:
      - '{{.CTL}} tui --root {{.ROOT}}'

  i18n:sync:
    desc: Translate only the strings with no cached German yet
    deps: [bin]
    cmds:
      - '{{.CTL}} i18n-sync --root {{.ROOT}}'

  i18n:sync:dry:
    desc: Report what i18n-sync would translate, without writing
    deps: [bin]
    cmds:
      - '{{.CTL}} i18n-sync --root {{.ROOT}} --dry-run --mock -v'

  i18n:review:
    desc: Review unverified German translations in a huh deck
    deps: [bin]
    interactive: true
    cmds:
      - '{{.CTL}} i18n-review --root {{.ROOT}}'

  i18n:vd:
    desc: Edit i18n_cache.json as a spreadsheet in VisiData
    interactive: true
    cmds:
      - vd i18n_cache.json

  i18n:fzf:
    desc: Fuzzy-pick one cached string and open it in $EDITOR
    interactive: true
    cmds:
      - |
        hash=$(jq -r '.[] | "\(.hash)\t\(.path_hint)\t\(.en)"' i18n_cache.json \
          | fzf --delimiter='\t' --with-nth=2,3 | cut -f1)
        [ -n "$hash" ] && ${EDITOR:-vi} +/"$hash" i18n_cache.json

  stats:
    desc: Translation coverage and orphaned entries
    deps: [bin]
    cmds:
      - '{{.CTL}} stats --root {{.ROOT}}'

  loadout:
    desc: Create or edit a named highlight loadout
    deps: [bin]
    interactive: true
    cmds:
      - '{{.CTL}} loadout-edit --root {{.ROOT}} --profile {{.PROFILE}}'

  render:
    desc: Export the active view as JSON (stdout by default)
    deps: [bin]
    cmds:
      - '{{.CTL}} render-json --root {{.ROOT}} --lang {{.LANG}} --profile {{.PROFILE}} --out {{default "-" .OUT}}'

  build:en:
    desc: Build the English PDF
    deps: [bin]
    cmds:
      - task: build:pdf
        vars: { LANG: en }

  build:de:
    desc: Build the German PDF
    deps: [bin]
    cmds:
      - task: build:pdf
        vars: { LANG: de }

  build:
    desc: Build the PDF for LANG (default en)
    deps: [bin]
    cmds:
      - '{{.CTL}} build-pdf --root {{.ROOT}} --lang {{.LANG}} --profile {{.PROFILE}} --stamp-sig --attach-json --reload-mupdf'

  build:pdf:
    internal: false
    desc: (used by build:en/build:de) build one language without the sig stamp
    deps: [bin]
    cmds:
      - '{{.CTL}} build-pdf --root {{.ROOT}} --lang {{.LANG}} --profile {{.PROFILE}} --attach-json --reload-mupdf'

  preview:
    desc: Open mupdf, then build so the viewer reloads in place
    deps: [bin]
    cmds:
      - |
        mupdf {{.OUT_PDF}} >/dev/null 2>&1 &
        sleep 0.4
      - '{{.CTL}} build-pdf --root {{.ROOT}} --lang {{.LANG}} --profile {{.PROFILE}} --stamp-sig --attach-json --reload-mupdf'

  unpack:
    desc: Extract the embedded JSON snapshot from a built PDF
    deps: [bin]
    cmds:
      - '{{.CTL}} unpack {{default .OUT_PDF .PDF}} --dir {{default "extracted" .DIR}}'

  mappe:
    desc: Merge Anschreiben + German CV + Zeugnisse into one packet
    deps: [bin]
    cmds:
      - '{{.CTL}} mappe --root {{.ROOT}} --profile {{.PROFILE}} --stamp-sig --attach-json --reload-mupdf'

  audit:
    desc: Page count, properties and provenance attachments of the built PDF
    cmds:
      - pdfcpu info {{default "dist/CV_Matt_Ji_en.pdf" .PDF}}
      - pdfcpu properties list {{default "dist/CV_Matt_Ji_en.pdf" .PDF}}
      - pdfcpu attachments list {{default "dist/CV_Matt_Ji_en.pdf" .PDF}}

  layout:
    desc: Print the pdfcpu create layout JSON of the built CV (PDF=path)
    cmds:
      - jq . {{default "dist/pdfcpu_cv_layout_en.json" .LAYOUT}}

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  fmt:
    desc: gofmt the Go sources
    cmds:
      - gofmt -l -w cmd internal

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  nix:build:
    desc: Build the packaged binaries through the flake
    cmds:
      - nix build .#resumectl .#workbench --print-out-paths

  # ── Application workbench ────────────────────────────────────────────────

  workbench:bin:
    desc: Build ./bin/workbench when sources changed
    sources:
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - go.mod
      - go.sum
    generates:
      - 'bin/workbench'
    cmds:
      - mkdir -p bin
      - go build -o bin/workbench ./cmd/workbench

  app:
    desc: Open the workbench TUI (new/switch capsule, tailor, letter, export)
    deps: [workbench:bin]
    interactive: true
    cmds:
      - '{{.WB}} tui --root {{.ROOT}} --budget {{default "2" .BUDGET}}'

  app:build:
    desc: >-
      Build a capsule: COMPANY=x [LENS=ai] [LANG=de] [ROLE=y] [BUDGET=2]
      [DENSITY=9.5] [GUIDES=1]
    deps: [workbench:bin]
    cmds:
      - >-
        {{.WB}} build --root {{.ROOT}} --company "{{.COMPANY}}"
        --budget {{default "2" .BUDGET}}
        {{if .LENS}}--lens {{.LENS}}{{end}}
        {{if .LANG}}--lang {{.LANG}}{{end}}
        {{if .ROLE}}--role "{{.ROLE}}"{{end}}
        {{if .DENSITY}}--density {{.DENSITY}}{{end}}
        {{if .GUIDES}}--guides{{end}}
        {{if .POINTS}}--points "{{.POINTS}}"{{end}}
        {{if .NO_COVER}}--no-cover{{end}}

  app:guides:
    desc: Rebuild the active capsule with pdfcpu alignment guides (COMPANY=x [LENS=ai] [LANG=de])
    deps: [workbench:bin]
    cmds:
      - >-
        {{.WB}} build --root {{.ROOT}} --company "{{.COMPANY}}" --guides
        {{if .LENS}}--lens {{.LENS}}{{end}}
        {{if .LANG}}--lang {{.LANG}}{{end}}
        --reload-mupdf

  app:new:
    desc: Draft a capsule without building (COMPANY=x [LENS=ai] [LANG=de])
    deps: [workbench:bin]
    cmds:
      - >-
        {{.WB}} new --root {{.ROOT}} --company "{{.COMPANY}}"
        {{if .LENS}}--lens {{.LENS}}{{end}}
        {{if .LANG}}--lang {{.LANG}}{{end}}

  app:list:
    desc: List application capsules under applications/
    deps: [workbench:bin]
    cmds:
      - '{{.WB}} list --root {{.ROOT}}'

  app:import:
    desc: Restore a capsule from the JSON embedded in an old PDF (PDF=path)
    deps: [workbench:bin]
    cmds:
      - '{{.WB}} import-pdf --root {{.ROOT}} {{.PDF}}'
