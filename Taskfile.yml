version: '3'

# resumetui pipeline: JSON Resume -> Typst -> pdfcpu -> mupdf.
# The legacy letter/CV pipeline lives in Taskfile.legacy.yml.

vars:
  LANG: '{{default "en" .LANG}}'
  OUT_DIR: dist
  OUT_PDF: 'dist/resume-{{.LANG}}.pdf'
  MAPPE_PDF: 'dist/bewerbungsmappe-{{.LANG}}.pdf'
  ACTIVE_JSON: 'dist/active-{{.LANG}}.json'

tasks:
  default:
    desc: List the pipeline tasks
    cmds:
      - task --list

  tui:
    desc: Launch the interactive loadout and bilingual editor
    interactive: true
    cmds:
      - go run ./cmd/resumetui

  i18n:sync:
    desc: Translate only the English strings with no cached translation
    cmds:
      - go run ./cmd/resumetui --sync-i18n

  export:
    desc: Materialize the loadout + language view used by Typst
    cmds:
      - mkdir -p {{.OUT_DIR}}
      - go run ./cmd/resumetui --export-lang={{.LANG}} --out={{.ACTIVE_JSON}}

  build:
    desc: Compile the active view to PDF and refresh mupdf in place
    deps:
      - task: export
        vars: { LANG: '{{.LANG}}' }
    sources:
      - resume.json
      - i18n_cache.json
      - loadouts.json
      - templates/resume.typ
    generates:
      - '{{.OUT_PDF}}'
    cmds:
      - mkdir -p {{.OUT_DIR}}
      - typst compile --root . --input json_path=/{{.ACTIVE_JSON}} templates/resume.typ {{.OUT_PDF}}
      - |
        if [ -f assets/signature.png ] && command -v pdfcpu >/dev/null 2>&1; then
          pdfcpu stamp add -pages l -mode image -- assets/signature.png "pos:br, off:-40 40, scale:0.18 abs, rot:0" {{.OUT_PDF}} || true
        fi
      - command -v pdfcpu >/dev/null 2>&1 && pdfcpu attachments add -q {{.OUT_PDF}} {{.ACTIVE_JSON}} || true
      - command -v pdfcpu >/dev/null 2>&1 && pdfcpu properties add -q {{.OUT_PDF}} "ResumeLang={{.LANG}}" "SyncedTask={{.LANG}}" || true
      - command -v pdfcpu >/dev/null 2>&1 && pdfcpu optimize -q {{.OUT_PDF}} || true
      - pkill -HUP mupdf || true

  preview:
    desc: Build, then open the PDF in mupdf
    deps:
      - task: build
        vars: { LANG: '{{.LANG}}' }
    cmds:
      - mupdf {{.OUT_PDF}} >/dev/null 2>&1 &

  mappe:
    desc: Merge Anschreiben + CV + Zeugnisse into one Bewerbungsmappe
    deps:
      - task: build
        vars: { LANG: de }
    cmds:
      - |
        set -- dist/resume-de.pdf
        [ -f assets/anschreiben.pdf ] && set -- assets/anschreiben.pdf "$@"
        [ -f assets/zeugnisse.pdf ] && set -- "$@" assets/zeugnisse.pdf
        pdfcpu merge -q {{.MAPPE_PDF}} "$@"
      - command -v pdfcpu >/dev/null 2>&1 && pdfcpu optimize -q {{.MAPPE_PDF}} || true
      - pkill -HUP mupdf || true

  audit:
    desc: Show page count, properties and provenance attachments
    cmds:
      - pdfcpu info {{.OUT_PDF}}
      - pdfcpu properties list {{.OUT_PDF}}
      - pdfcpu attachments list {{.OUT_PDF}}

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...
